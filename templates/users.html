{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
    <h2>User List</h2>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>S.No</th>
                <th>User ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
